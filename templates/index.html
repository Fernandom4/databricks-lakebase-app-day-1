<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      background: #FBF8F6;
      min-height: 100vh;
      color: #3d2c2e;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(139, 21, 56, 0.08);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #8B1538;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .hint {
      color: #6d5154;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 12px 16px;
      background: #FFF0F3;
      border-left: 3px solid #E5B8C5;
      border-radius: 4px;
    }

    form {
      background: #FFF9FB;
      padding: 24px;
      border-radius: 6px;
      margin-bottom: 24px;
      border: 1px solid #F4D9E0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #6d5154;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #E5B8C5;
      border-radius: 4px;
      transition: all 0.2s ease;
      background: white;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #8B1538;
      box-shadow: 0 0 0 3px rgba(139, 21, 56, 0.1);
    }

    input[type="text"]::placeholder {
      color: #C7A4AE;
    }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      background: #8B1538;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    button:hover {
      background: #6B0F2B;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(139, 21, 56, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
      background: #FFF9FB;
      border: 1px solid #F4D9E0;
      color: #6d5154;
      transition: all 0.2s ease;
    }

    #result:empty {
      display: none;
    }

    #result.success {
      background: #E8F5E8;
      border-color: #A8D5A8;
      color: #2A5A2A;
    }

    #result.error {
      background: #FFE8ED;
      border-color: #F4A4B8;
      color: #8B1538;
    }

    table {
      width: 100%;
      margin-top: 32px;
      border-collapse: collapse;
      border: 1px solid #F4D9E0;
      border-radius: 4px;
      overflow: hidden;
    }

    thead {
      background: #8B1538;
      border-bottom: 2px solid #6B0F2B;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: white;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr {
      background: white;
      transition: background-color 0.15s ease;
    }

    tbody tr:hover {
      background: #FFF9FB;
    }

    td {
      padding: 14px 16px;
      color: #6d5154;
      border-bottom: 1px solid #F4E8EC;
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(1) {
      font-weight: 600;
      color: #8B1538;
      font-size: 14px;
    }

    td:nth-child(3) {
      font-weight: 500;
      color: #6d5154;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    }

    td:nth-child(4) {
      color: #9A8184;
      font-size: 13px;
    }

    .delete-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #8B1538;
      background: transparent;
      border: 1px solid #E5B8C5;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .delete-btn:hover {
      background: #FFE8ED;
      border-color: #D89BAB;
      transform: translateY(0);
      box-shadow: none;
    }

    .delete-btn:active {
      background: #F4D9E0;
    }

    td:last-child {
      text-align: center;
      width: 180px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .news-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: white;
      background: #8B1538;
      border: 1px solid #8B1538;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .news-btn:hover {
      background: #6B0F2B;
      border-color: #6B0F2B;
      transform: translateY(0);
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.5);
    }

    .modal-content {
      background-color: white;
      margin: 5% auto;
      padding: 0;
      border-radius: 8px;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .modal-header {
      padding: 20px 24px;
      background: #8B1538;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .close {
      color: white;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: background 0.2s ease;
    }

    .close:hover {
      background: rgba(255,255,255,0.2);
    }

    .modal-body {
      padding: 24px;
      max-height: calc(80vh - 80px);
      overflow-y: auto;
    }

    .news-item {
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #F4D9E0;
      border-radius: 4px;
      background: #FFF9FB;
      transition: all 0.2s ease;
    }

    .news-item:hover {
      background: white;
      box-shadow: 0 2px 8px rgba(139, 21, 56, 0.1);
    }

    .news-item:last-child {
      margin-bottom: 0;
    }

    .news-title {
      font-size: 16px;
      font-weight: 600;
      color: #8B1538;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .news-title a {
      color: #8B1538;
      text-decoration: none;
    }

    .news-title a:hover {
      text-decoration: underline;
    }

    .news-meta {
      font-size: 12px;
      color: #9A8184;
      margin-bottom: 8px;
    }

    .news-description {
      font-size: 14px;
      color: #6d5154;
      line-height: 1.6;
    }

    .news-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9A8184;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 16px;
      }

      .container {
        padding: 28px;
      }

      h1 {
        font-size: 22px;
      }

      form {
        padding: 20px;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </form>

    <div id="result"></div>

    <table id="watchlist-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Email</th>
          <th>Latest price</th>
          <th>Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="watchlist-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? "$" + Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td><td><div class="action-btns"><button class="news-btn" onclick="fetchNews('${row.symbol}')">News</button><button class="delete-btn" onclick="deleteFromWatchlist('${row.symbol}')">Remove</button></div></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.className = "";
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Successfully added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2);
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    });

    async function deleteFromWatchlist(symbol) {
      if (!confirm(`Remove ${symbol} from your watchlist?`)) {
        return;
      }

      resultEl.className = "";
      resultEl.textContent = "Removing from watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Successfully removed " + symbol + " from watchlist";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    }

    async function fetchNews(symbol) {
      const modal = document.getElementById("newsModal");
      const modalTitle = document.getElementById("modalTitle");
      const modalBody = document.getElementById("newsModalBody");

      modal.style.display = "block";
      modalTitle.textContent = `News for ${symbol}`;
      modalBody.innerHTML = '<div class="loading">Loading news...</div>';

      try {
        const resp = await fetch(`/watchlist/${symbol}/news?limit=10`);
        const data = await resp.json();

        if (!resp.ok) {
          modalBody.innerHTML = `<div class="error" style="padding: 20px;">${data.error || resp.statusText}</div>`;
          return;
        }

        if (!data.news || data.news.length === 0) {
          modalBody.innerHTML = '<div class="loading">No news articles found for this ticker.</div>';
          return;
        }

        modalBody.innerHTML = data.news.map(article => {
          const publishedDate = article.published_utc ? new Date(article.published_utc).toLocaleString() : "Unknown date";
          const imageHtml = article.image_url ? `<img src="${article.image_url}" class="news-image" alt="${article.title}">` : "";
          const articleUrl = article.article_url || "#";
          const author = article.author ? `by ${article.author}` : "";
          const publisher = article.publisher_name ? `• ${article.publisher_name}` : "";

          return `
            <div class="news-item">
              ${imageHtml}
              <div class="news-title"><a href="${articleUrl}" target="_blank">${article.title || "Untitled"}</a></div>
              <div class="news-meta">${publishedDate} ${author} ${publisher}</div>
              <div class="news-description">${article.description || ""}</div>
            </div>
          `;
        }).join("");
      } catch (err) {
        modalBody.innerHTML = `<div class="error" style="padding: 20px;">Failed to fetch news: ${err}</div>`;
      }
    }

    function closeModal() {
      document.getElementById("newsModal").style.display = "none";
    }

    // Close modal when clicking outside of it
    window.onclick = function(event) {
      const modal = document.getElementById("newsModal");
      if (event.target == modal) {
        closeModal();
      }
    }

    loadWatchlist();
  </script>

  <!-- News Modal -->
  <div id="newsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">News</h2>
        <button class="close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="newsModalBody">
        <div class="loading">Loading news...</div>
      </div>
    </div>
  </div>
</body>
</html>
