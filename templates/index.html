<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      background: #f8f9fa;
      min-height: 100vh;
      color: #2c3e50;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .hint {
      color: #6c757d;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
      padding: 12px 16px;
      background: #f8f9fa;
      border-left: 3px solid #dee2e6;
      border-radius: 4px;
    }

    form {
      background: #fafbfc;
      padding: 24px;
      border-radius: 6px;
      margin-bottom: 24px;
      border: 1px solid #e9ecef;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #495057;
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      transition: all 0.2s ease;
      background: white;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #495057;
      box-shadow: 0 0 0 3px rgba(73, 80, 87, 0.08);
    }

    input[type="text"]::placeholder {
      color: #adb5bd;
    }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      background: #495057;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    button:hover {
      background: #343a40;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(0);
    }

    #result {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      color: #495057;
      transition: all 0.2s ease;
    }

    #result:empty {
      display: none;
    }

    #result.success {
      background: #d4edda;
      border-color: #c3e6cb;
      color: #155724;
    }

    #result.error {
      background: #f8d7da;
      border-color: #f5c6cb;
      color: #721c24;
    }

    table {
      width: 100%;
      margin-top: 32px;
      border-collapse: collapse;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      overflow: hidden;
    }

    thead {
      background: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
    }

    th {
      padding: 14px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #495057;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr {
      background: white;
      transition: background-color 0.15s ease;
    }

    tbody tr:hover {
      background: #f8f9fa;
    }

    td {
      padding: 14px 16px;
      color: #495057;
      border-bottom: 1px solid #e9ecef;
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    td:nth-child(1) {
      font-weight: 600;
      color: #2c3e50;
      font-size: 14px;
    }

    td:nth-child(3) {
      font-weight: 500;
      color: #495057;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    }

    td:nth-child(4) {
      color: #6c757d;
      font-size: 13px;
    }

    .delete-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      color: #721c24;
      background: transparent;
      border: 1px solid #f5c6cb;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin: 0;
    }

    .delete-btn:hover {
      background: #f8d7da;
      border-color: #f5c6cb;
      transform: translateY(0);
      box-shadow: none;
    }

    .delete-btn:active {
      background: #f5c6cb;
    }

    td:last-child {
      text-align: center;
      width: 100px;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 16px;
      }

      .container {
        padding: 28px;
      }

      h1 {
        font-size: 22px;
      }

      form {
        padding: 20px;
      }

      table {
        font-size: 13px;
      }

      th, td {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

    <form id="stock-form">
      <label for="symbol">Ticker symbol</label>
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </form>

    <div id="result"></div>

    <table id="watchlist-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Email</th>
          <th>Latest price</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="watchlist-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? "$" + Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td><td><button class="delete-btn" onclick="deleteFromWatchlist('${row.symbol}')">Remove</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.className = "";
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Successfully added " + data.symbol + " at $" + Number(data.latest_price).toFixed(2);
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    });

    async function deleteFromWatchlist(symbol) {
      if (!confirm(`Remove ${symbol} from your watchlist?`)) {
        return;
      }

      resultEl.className = "";
      resultEl.textContent = "Removing from watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Successfully removed " + symbol + " from watchlist";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    }

    loadWatchlist();
  </script>
</body>
</html>
